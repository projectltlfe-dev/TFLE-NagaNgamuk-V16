<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Naga Ngamuk: Jangan Dibakar!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --fd:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --fb:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ink:#3B1A0E;--parch:#FCEBC6;--parch2:#F6DBA4;--brown:#6B3410;--brownD:#4E2810;
  --gold:#FFC93C;--red:#E5322D;--green:#2FBF71;--cyan:#41E3FF;
  --spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140604}
body{font-family:var(--fb);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
input{font-family:inherit;-webkit-user-select:text;user-select:text}

/* ---------- Bingkai: lebar 100%, tinggi maks 600px ---------- */
#app{position:relative;width:100%;height:600px;max-height:600px;overflow:hidden;
  background:radial-gradient(80% 90% at 50% 40%,#3a140c,#140604)}
#stage{position:absolute;left:50%;top:50%;width:400px;height:600px;overflow:hidden;transform-origin:50% 50%;
  transform:translate(-50%,-50%);background:#2A0D09;box-shadow:0 0 60px rgba(0,0,0,.6)}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- Dunia ---------- */
#world{position:absolute;inset:0;touch-action:none}
#world>div{position:absolute}
.bg,.bgc{inset:0}
.bg svg,.bgc svg,.lava svg,.floor svg{width:100%;height:100%;display:block}
.bgc{opacity:0;transition:opacity 1.8s ease}
#world.cool .bgc{opacity:1}
.lava{left:0;right:0;height:62px;z-index:4}
.lava>div{position:absolute;inset:0}
.lava .water{opacity:0;transition:opacity 1.8s ease}
#world.cool .lava .water{opacity:1}
.lava::after{content:'';position:absolute;left:0;right:0;top:-40px;height:46px;background:linear-gradient(transparent,rgba(255,170,60,.35));pointer-events:none;transition:opacity 1.8s}
#world.cool .lava::after{opacity:0}
.lavaflow{animation:flow 6s linear infinite}
@keyframes flow{to{transform:translateX(-300px)}}
.floor{left:0;right:0;bottom:0;z-index:5}
.ledge{width:104px;z-index:6;transition:opacity .4s}
.ledge svg{width:100%;height:auto;display:block}
.ledge.L{left:-6px}.ledge.R{right:-6px}
#props0{inset:0;z-index:2;pointer-events:none}
#props{inset:0;z-index:7;pointer-events:none}
#props .pe{pointer-events:auto}
#items{inset:0;z-index:9;pointer-events:none}
#fx{inset:0;z-index:12;pointer-events:none;overflow:hidden}
.tint{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:11}

/* ---------- Naga ---------- */
.drg{z-index:3;--sk:#E2432A;--skD:#A3261A;--skL:#F27D5E;--fs:1;transition:filter .4s}
.drg svg{width:100%;height:auto;display:block;overflow:visible}
.sk{fill:var(--sk)}.ol{stroke:var(--skD);stroke-width:3.5}.skd{fill:var(--skD)}.skl{fill:var(--skL)}.sks{stroke:var(--sk)}.skds{stroke:var(--skD)}
.drg .mood,.drg .arms{display:none}
.drg[data-mood=angry] .m-angry,.drg[data-mood=annoyed] .m-annoyed,.drg[data-mood=pout] .m-pout,.drg[data-mood=smile] .m-smile,
.drg[data-mood=giggle] .m-giggle,.drg[data-mood=happy] .m-happy,.drg[data-mood=laugh] .m-laugh,.drg[data-mood=star] .m-star,
.drg[data-mood=chomp] .m-chomp{display:inline}
.drg[data-arms=cross] .a-cross,.drg[data-arms=rest] .a-rest,.drg[data-arms=belly] .a-belly,.drg[data-arms=thumb] .a-thumb,.drg[data-arms=gem] .a-gem{display:inline}
.drg .d-all{transform-box:view-box;transform-origin:200px 420px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,.986)}}
.drg .d-head{transform-box:view-box;transform-origin:200px 214px;animation:headbob 3.2s ease-in-out infinite}
@keyframes headbob{50%{transform:translateY(3px) rotate(.8deg)}}
.drg .wing{transform-box:view-box;transform-origin:134px 246px;animation:flap 2.6s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(7deg)}}
.drg .tailfire{transform-box:view-box;transform-origin:340px 272px;transform:scale(var(--fs));transition:transform .4s var(--spring)}
.drg .tf-in{transform-box:view-box;transform-origin:340px 272px;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.88,1.1) skewX(5deg)}}
.drg .tail{transform-box:view-box;transform-origin:250px 380px;animation:tailw 3s ease-in-out infinite}
@keyframes tailw{50%{transform:rotate(-4deg)}}
.drg .d-gem{animation:gemglow 1s ease-in-out infinite alternate}
@keyframes gemglow{to{filter:drop-shadow(0 0 10px #E6B8FF) brightness(1.15)}}
.drg.laughing .d-all{animation:laughShake .16s ease-in-out infinite alternate}
@keyframes laughShake{from{transform:rotate(-1.4deg) translateY(0)}to{transform:rotate(1.4deg) translateY(-4px)}}
.drg.wiggle .d-head{animation:wiggle .12s ease-in-out 4 alternate}
@keyframes wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg) translateY(-3px)}}
.drg.hurt{animation:dshake .45s}
@keyframes dshake{0%,100%{translate:0}20%{translate:-8px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:3px 0}}
.drg.hop{animation:dhop .5s var(--spring)}
@keyframes dhop{40%{translate:0 -14px}}

/* ---------- Chef ---------- */
.chef{z-index:8;transition:opacity .3s}
.chef svg{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 95%;transition:transform .12s}
.chef .pose,.chef .face{display:none}
.chef[data-pose=basket] .p-basket,.chef[data-pose=feather] .p-feather,.chef[data-pose=thumbs] .p-thumbs,.chef[data-pose=cheer] .p-cheer,.chef[data-pose=idle] .p-idle{display:inline}
.chef[data-face=smile] .f-smile,.chef[data-face=grin] .f-grin,.chef[data-face=oops] .f-oops,.chef[data-face=focus] .f-focus{display:inline}
.chef .feather{transform-box:view-box;transform-origin:100px 86px;transform:rotate(var(--fr,0deg));transition:transform .18s}
.chef.swish .feather{animation:swish .26s ease-out}
@keyframes swish{0%{transform:rotate(var(--fr,0deg))}35%{transform:rotate(calc(var(--fr,0deg) - 16deg))}70%{transform:rotate(calc(var(--fr,0deg) + 8deg))}100%{transform:rotate(var(--fr,0deg))}}
.chef.bounce svg{animation:cbounce .6s ease-in-out infinite}
@keyframes cbounce{50%{transform:translateY(-10px)}}
.rock{z-index:7}
.rock svg{width:100%;height:auto;display:block}

/* ---------- Item jatuh ---------- */
.item{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;will-change:transform}
.item svg{width:100%;height:100%;display:block;overflow:visible}
.item.big{width:54px;height:54px;margin:-27px 0 0 -27px}
.item .aura{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
.item.orb{filter:drop-shadow(0 0 10px #7FDBFF)}
.puff{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
.pop{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;font:22px var(--fd);color:#fff;letter-spacing:.5px;
  text-shadow:0 2px 0 #5A1A08,2px 0 0 #5A1A08,-2px 0 0 #5A1A08,0 -2px 0 #5A1A08,2px 2px 0 #5A1A08,-2px 2px 0 #5A1A08,2px -2px 0 #5A1A08,-2px -2px 0 #5A1A08,0 5px 6px rgba(0,0,0,.35)}
.pop.good{color:#9DF2FF}.pop.gold{color:#FFD23F}.pop.bad{color:#FF8A70}.pop.pink{color:#FFB3D9}.pop.green{color:#8CF5A8}
.pop.huge{font-size:42px}
.spark{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px;pointer-events:none}
.spark svg,.heart svg{width:100%;height:100%;display:block}
.heart{position:absolute;left:0;top:0;width:24px;height:22px;margin:-11px -12px;pointer-events:none}
.conf{position:absolute;left:0;top:0;width:9px;height:14px;border-radius:2px;pointer-events:none}
.bubble{position:absolute;padding:4px 10px;border-radius:14px;background:#fff;font:18px var(--fd);color:#B5320F;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
.bubble::after{content:'';position:absolute;left:12px;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:7px;padding:8px 56px 0 8px;transition:transform .5s var(--smooth),opacity .4s;pointer-events:none}
#hud.hide{transform:translateY(-120%);opacity:0}
.hbox{height:44px;border-radius:13px;background:rgba(28,9,5,.8);border:2px solid rgba(255,201,60,.5);box-shadow:0 3px 0 rgba(0,0,0,.35);color:#fff}
.hs{min-width:70px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;line-height:1}
.hs small{font:900 9px var(--fb);letter-spacing:1.2px;color:#FFD98A}
.hs b{font:21px var(--fd);margin-top:2px;font-weight:400}
.hr{flex:1;min-width:0;padding:5px 10px}
.hr .rl{font:900 10px var(--fb);letter-spacing:.8px;color:#FFE7C2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.hr .rl span{color:#FF6A55;transition:color .3s}
.hr .rb{height:13px;margin-top:5px;border-radius:8px;background:#2B0F0A;border:2px solid #0E0402;overflow:hidden;position:relative}
.hr .rb i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:6px;background:#FF4A2A;transition:width .35s var(--smooth),background .4s}
.hr .rb i::after{content:'';position:absolute;left:4px;right:4px;top:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.45)}
.ht{position:relative;width:46px;height:46px;flex:none}
.ht svg{width:46px;height:46px;transform:rotate(-90deg);display:block}
.ht circle{stroke-width:5}
.ht .tb{fill:rgba(28,9,5,.85);stroke:#4A1D12}
.ht .tf{fill:none;stroke:#FFC93C;stroke-linecap:round;stroke-dasharray:119.4;transition:stroke .3s}
.ht b{position:absolute;inset:0;display:grid;place-items:center;font:17px var(--fd);color:#fff;font-weight:400}
.ht.low .tf{stroke:#FF4A2A}.ht.low b{color:#FF8A75;animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.14)}}
#mtag{position:absolute;left:50%;top:58px;z-index:19;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  font:900 10.5px var(--fb);letter-spacing:1px;color:#FFE7C2;background:rgba(28,9,5,.62);padding:3px 12px;border-radius:99px;transition:opacity .4s}
#mtag.hide{opacity:0}
#bgm{position:absolute;top:9px;right:8px;z-index:40;width:42px;height:42px;border-radius:13px;background:rgba(28,9,5,.82);
  border:2px solid rgba(255,201,60,.6);box-shadow:0 3px 0 rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .1s}
#bgm:active{transform:translateY(2px)}
#bgm svg{width:27px;height:22px;display:block}
#bgm .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .7s ease-in-out infinite alternate}
#bgm .eq rect:nth-child(2){animation-delay:.2s}#bgm .eq rect:nth-child(3){animation-delay:.4s}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
#bgm em{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:900 8px var(--fb);letter-spacing:1px;color:#FFE7C2;font-style:normal;text-shadow:0 1px 2px #000}
#copy{position:absolute;left:0;right:0;bottom:3px;z-index:45;text-align:center;pointer-events:none}
#copy span{display:inline-block;font:800 9.5px var(--fb);color:rgba(255,240,220,.88);background:rgba(20,6,3,.55);padding:2px 10px;border-radius:99px;letter-spacing:.2px}

/* ---------- UI / panel ---------- */
#ui{position:absolute;inset:0;z-index:30;pointer-events:none}
#ui>*{pointer-events:auto}
#ui>.np{pointer-events:none}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:60px 14px 24px}
.modal.top{padding-top:14px}
.modal.top .panel{max-width:460px}
.backdrop{position:absolute;inset:0;background:rgba(18,5,2,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel{position:relative;width:100%;max-width:440px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  background:linear-gradient(#FFF3D8,var(--parch) 40%,#F8DFAE);border:4px solid var(--brown);border-radius:22px;padding:18px 18px 16px;
  box-shadow:0 7px 0 var(--brownD),0 18px 44px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.5);text-align:center;scrollbar-width:thin}
.panel h2{font:27px/1.02 var(--fd);color:#C2380F;letter-spacing:.3px;font-weight:400}
.panel h3{font:18px/1.1 var(--fd);color:var(--brown);font-weight:400}
.panel p{font:700 14.5px/1.45 var(--fb);color:#4A2A18}
.panel p b{color:#B5320F}
.tag{display:inline-block;font:900 10.5px var(--fb);letter-spacing:1.4px;color:#fff;background:#B5320F;padding:4px 12px;border-radius:99px;margin-bottom:8px}
.tag.blue{background:#1F86C7}.tag.green{background:#1E9A57}.tag.purple{background:#8A3BD1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:190px;height:50px;padding:0 24px;border-radius:16px;margin-top:14px;
  font:20px var(--fd);font-weight:400;color:#fff;letter-spacing:.5px;background:linear-gradient(#FF8D3F,#E5452A);
  box-shadow:0 5px 0 #9C2410,0 9px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s,filter .2s,opacity .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9C2410}
.btn.green{background:linear-gradient(#5BE08A,#1FA557);box-shadow:0 5px 0 #136B3B,0 9px 18px rgba(0,0,0,.25)}
.btn.green:active{box-shadow:0 1px 0 #136B3B}
.btn.blue{background:linear-gradient(#5CC8FF,#1F86C7);box-shadow:0 5px 0 #145A87,0 9px 18px rgba(0,0,0,.25)}
.btn.ghost{background:#F3D9A4;color:var(--brown);text-shadow:none;box-shadow:0 5px 0 #C9A266}
.btn[disabled]{filter:grayscale(1);opacity:.5;pointer-events:none}
.btn.pulse{animation:bpulse 1.2s ease-in-out infinite}
@keyframes bpulse{50%{transform:scale(1.05)}}

/* Start */
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 14px 24px}
.logo{position:relative;text-align:center;margin-top:4px;line-height:.86;filter:drop-shadow(0 6px 0 rgba(40,8,2,.55))}
.logo .l1,.logo .l2{display:block;font:46px var(--fd);font-weight:400;letter-spacing:1px;color:#FFD23F;
  -webkit-text-stroke:0;text-shadow:0 4px 0 #8A1E06,3px 0 0 #3B0F04,-3px 0 0 #3B0F04,0 -3px 0 #3B0F04,3px 3px 0 #3B0F04,-3px 3px 0 #3B0F04,3px -3px 0 #3B0F04,-3px -3px 0 #3B0F04,0 7px 0 #3B0F04}
.logo .l2{color:#FF7A1A;font-size:54px}
.logo .sub{display:inline-block;margin-top:8px;font:17px var(--fd);font-weight:400;color:#6B3410;background:linear-gradient(#FFF3D8,#F6DBA4);border:3px solid #6B3410;
  padding:3px 18px 4px;border-radius:12px;transform:rotate(-3deg);box-shadow:0 4px 0 #4E2810}
.logo .fl{position:absolute;width:34px;height:44px;top:-6px}
.scard{position:relative;width:100%;max-width:400px;background:linear-gradient(#FFF3D8,var(--parch));border:4px solid var(--brown);border-radius:22px;padding:14px 16px 12px;text-align:center;
  box-shadow:0 7px 0 var(--brownD),0 16px 40px rgba(0,0,0,.5)}
.scard label{display:block;font:19px var(--fd);font-weight:400;color:#C2380F}
.scard .hint{font:800 12.5px var(--fb);color:#7A5236;margin:2px 0 8px}
.scard input{width:100%;height:46px;border:3px solid #D9B57A;border-radius:14px;background:#FFFBF0;padding:0 14px;font:800 18px var(--fb);color:var(--ink);outline:none;text-align:center;transition:border-color .2s,box-shadow .2s}
.scard input:focus{border-color:#E5452A;box-shadow:0 0 0 4px rgba(229,69,42,.18)}
.scard .snd{font:800 11px var(--fb);color:#9A7356;margin-top:6px}
.scard .btn{height:46px;margin-top:10px}

/* Intro / brief */
.face{width:84px;height:84px;margin:-4px auto 6px;border-radius:50%;background:radial-gradient(#FFE3B0,#F6C27A);border:4px solid var(--brown);overflow:hidden;box-shadow:0 4px 0 var(--brownD)}
.face svg{width:100%;height:100%;display:block}
.mlist{display:grid;gap:7px;margin:12px 0 2px;text-align:left}
.mi{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.6);border:2px solid #E6C48A;border-radius:14px;padding:6px 10px}
.mi .ic{flex:none;width:42px;height:42px;border-radius:12px;background:#3A140C;display:grid;place-items:center}
.mi .ic svg{width:32px;height:32px}
.mi b{display:block;font:16px var(--fd);font-weight:400;color:#B5320F;line-height:1.05}
.mi small{display:block;font:800 12px/1.3 var(--fb);color:#6B4A30}
.mi.done{background:rgba(205,255,220,.7);border-color:#7ED69B}
.mi .st{margin-left:auto;font:900 11px var(--fb);color:#1E9A57;white-space:nowrap}
.how{display:flex;gap:8px;margin:12px 0 4px;justify-content:center}
.hw{flex:1;min-width:0;background:rgba(255,255,255,.65);border:2px solid #E6C48A;border-radius:14px;padding:8px 4px 7px}
.hw .ic{height:46px;display:flex;align-items:center;justify-content:center;gap:2px}
.hw .ic svg{width:38px;height:38px}
.hw .ic .chef svg,.hw .ic .drg svg{width:100%;height:auto}
.hw .ic .drg svg,.face .drg svg{overflow:hidden}
.hw .ic .chef{position:relative}
.hw b{display:block;font:15px var(--fd);font-weight:400;color:var(--brown);margin-top:3px}
.hw small{display:block;font:800 11px/1.25 var(--fb);color:#7A5236}
.hw.good{border-color:#8FD3F7;background:rgba(220,245,255,.75)}
.hw.bad{border-color:#FF9F8A;background:rgba(255,226,218,.8)}
.goal{margin-top:10px;font:800 13px/1.35 var(--fb);color:#fff;background:#3A140C;border-radius:12px;padding:8px 12px}
.goal b{color:#FFD23F}
.keys{font:800 11px var(--fb);color:#9A7356;margin-top:6px}

/* Banner */
.bnwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 10px 20px;pointer-events:none}
.ribbon{position:relative;width:min(100%,560px);aspect-ratio:600/150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16% 4%}
.ribbon>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.3))}
.ribbon .t1,.ribbon .t2{display:block;white-space:nowrap;font-family:var(--fd);font-weight:400;line-height:1;text-align:center;color:#FFC93C;letter-spacing:.5px;
  text-shadow:0 2px 0 #6B3410,2px 0 0 #6B3410,-2px 0 0 #6B3410,0 -2px 0 #6B3410,2px 2px 0 #6B3410,-2px 2px 0 #6B3410,2px -2px 0 #6B3410,-2px -2px 0 #6B3410,0 5px 0 #6B3410}
.ribbon .t1{font-size:calc(min(var(--LW,400),560) * .068px)}
.ribbon .t1.long{font-size:calc(min(var(--LW,400),560) * .046px)}
.bbd{position:absolute;inset:0;z-index:-2;background:radial-gradient(70% 60% at 50% 45%,rgba(18,5,2,.25),rgba(18,5,2,.62))}
.ribbon .t2{font-size:calc(min(var(--LW,400),560) * .042px);color:#FFF3D8;margin-top:4px}
.bsub{margin-top:8px;max-width:440px;font:800 14px/1.35 var(--fb);color:#fff;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.8);background:rgba(28,9,5,.55);padding:6px 14px;border-radius:12px}
.scorebox{margin-top:10px;display:flex;align-items:center;gap:10px;background:rgba(28,9,5,.82);border:3px solid #FFC93C;border-radius:16px;padding:6px 16px;color:#fff;pointer-events:auto}
.scorebox b{font:30px var(--fd);font-weight:400;color:#FFD23F}
.scorebox small{font:900 11px var(--fb);letter-spacing:1px;color:#FFE7C2}
.stars{display:flex;gap:4px;justify-content:center}
.stars i{width:30px;height:30px;display:block;filter:grayscale(1) brightness(.6);opacity:.55}
.stars i.on{filter:none;opacity:1;animation:starIn .5s var(--spring) both}
.stars i svg{width:100%;height:100%}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.badgeimg{width:96px;height:104px;margin:0 auto}
.badgeimg svg{width:100%;height:100%;overflow:visible}

/* Lesson */
.lhead{display:flex;align-items:center;gap:10px;text-align:left}
.lhead .badgeimg{flex:none;width:64px;height:70px;margin:0}
.lhead .tag{margin-bottom:4px}
.lesson .lt{font:25px/1 var(--fd);font-weight:400;color:#C2380F}
.lesson .ls{font:900 13.5px/1.35 var(--fb);color:#6B3410;background:#F9D58C;border-radius:10px;padding:6px 10px;margin:6px 0 10px}
.lesson .tips{text-align:left;display:grid;gap:6px;margin-top:10px}
.lesson .tips div{display:flex;gap:8px;align-items:flex-start;font:800 13px/1.35 var(--fb);color:#4A2A18;background:rgba(255,255,255,.65);border-radius:10px;padding:7px 10px}
.lesson .tips div i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;background:#1E9A57;color:#fff;display:grid;place-items:center;font:900 12px var(--fb)}
.lesson .tips .h{background:none;padding:0 2px;font:900 11px var(--fb);letter-spacing:1px;color:#9A7356}

/* Countdown */
.cd{position:absolute;left:50%;top:44%;font:110px/1 var(--fd);font-weight:400;color:#FFD23F;pointer-events:none;transform:translate(-50%,-50%);
  text-shadow:0 5px 0 #6B3410,4px 0 0 #6B3410,-4px 0 0 #6B3410,0 -4px 0 #6B3410,4px 4px 0 #6B3410,-4px 4px 0 #6B3410,4px -4px 0 #6B3410,-4px -4px 0 #6B3410,0 12px 20px rgba(0,0,0,.4)}
.cd.word{font-size:58px;white-space:nowrap}

/* ---------- Misi 2: jalur ritme ---------- */
.lane{position:absolute;height:70px;border-radius:35px;background:linear-gradient(rgba(28,9,5,.88),rgba(50,16,8,.88));border:3px solid rgba(255,201,60,.55);box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 0 18px rgba(255,140,40,.25);overflow:hidden}
.lane::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,rgba(255,220,150,.35) 0 10px,transparent 10px 22px)}
.ring{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:4px solid #FFF3D8;
  box-shadow:0 0 0 4px rgba(255,201,60,.45),0 0 18px rgba(255,201,60,.8),inset 0 0 12px rgba(255,201,60,.6);display:grid;place-items:center;z-index:2}
.ring svg{width:34px;height:34px;opacity:.85}
.ring.hit{animation:ringHit .28s ease-out}
.ring.perfect{animation:ringPerf .35s ease-out}
.ring.miss{animation:ringMiss .3s ease-out}
@keyframes ringHit{50%{transform:scale(1.18);box-shadow:0 0 0 6px rgba(140,245,168,.7),0 0 26px #8CF5A8}}
@keyframes ringPerf{50%{transform:scale(1.28);box-shadow:0 0 0 8px rgba(255,210,63,.9),0 0 36px #FFD23F}}
@keyframes ringMiss{50%{transform:scale(.9);box-shadow:0 0 0 6px rgba(255,90,70,.7),0 0 20px #FF5A46}}
.note{position:absolute;left:0;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;will-change:transform;z-index:3;filter:drop-shadow(0 0 6px rgba(255,220,80,.85))}
.note svg{width:100%;height:100%;display:block}
.note.final{width:60px;height:60px;margin:-30px 0 0 -30px;filter:drop-shadow(0 0 10px #FFD23F)}
.note.gone{opacity:0;transition:opacity .25s}
.tapzone{position:absolute;left:0;right:0;bottom:0;top:62px;z-index:8}
.tapbtn{position:absolute;z-index:9;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FFE38A,#FF9A2E 60%,#E5452A);border:4px solid #FFF3D8;box-shadow:0 6px 0 #9C2410,0 10px 20px rgba(0,0,0,.4);
  display:grid;place-items:center;font:15px var(--fd);font-weight:400;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none}
.tapbtn.down{transform:translateY(4px);box-shadow:0 2px 0 #9C2410}
.combo{position:absolute;left:50%;transform:translateX(-50%);font:24px var(--fd);font-weight:400;color:#FFD23F;white-space:nowrap;pointer-events:none;z-index:9;
  text-shadow:0 2px 0 #6B3410,2px 0 0 #6B3410,-2px 0 0 #6B3410,0 -2px 0 #6B3410,0 4px 6px rgba(0,0,0,.4);transition:opacity .2s}
.lhint{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:900 12px var(--fb);color:#FFE7C2;background:rgba(28,9,5,.7);padding:4px 12px;border-radius:99px;pointer-events:none;z-index:9}

/* ---------- Misi 3: puzzle ---------- */
.order{position:absolute;z-index:9;background:#FFFDF6;border:3px solid var(--brown);border-radius:18px;padding:6px 8px 7px;box-shadow:0 5px 0 rgba(0,0,0,.35);text-align:center}
.order::before{content:'';position:absolute;left:-16px;top:34px;border:9px solid transparent;border-right:12px solid var(--brown);border-left:0}
.order::after{content:'';position:absolute;left:-11px;top:37px;border:6px solid transparent;border-right:9px solid #FFFDF6;border-left:0}
.order .oh{font:900 9.5px var(--fb);letter-spacing:1px;color:#9A7356}
.order .on{font:14px/1.05 var(--fd);font-weight:400;color:#C2380F;margin:1px 0 4px}
.order .oi{display:flex;justify-content:center;gap:4px}
.order .oi span{width:40px;height:40px;border-radius:10px;background:#F6E7C8;display:grid;place-items:center;position:relative;transition:background .3s}
.order .oi span svg{width:32px;height:32px}
.order .oi span.ok{background:#C9F5D6}
.order .oi span.ok::after{content:'✓';position:absolute;right:-4px;top:-5px;width:16px;height:16px;border-radius:50%;background:#1E9A57;color:#fff;font:900 10px/16px var(--fb)}
.order.kilat{animation:kilat .5s ease-in-out infinite alternate}
@keyframes kilat{to{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 4px #FFD23F,0 0 22px #FFD23F}}
.slot{position:absolute;z-index:8;pointer-events:auto}
.slot .fr{position:absolute;left:50%;top:0;width:66px;height:66px;margin-left:-33px;border-radius:16px;border:3px solid #41E3FF;
  background:rgba(10,40,60,.45);box-shadow:0 0 10px #41E3FF,inset 0 0 12px rgba(65,227,255,.5);display:grid;place-items:center;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.slot .fr::before{content:'';position:absolute;inset:8px;border-radius:10px;border:2px dashed rgba(160,240,255,.5)}
.slot .fr svg{width:48px;height:48px;position:relative}
.slot.filled .fr{border-color:#8CF5A8;box-shadow:0 0 14px #8CF5A8,inset 0 0 12px rgba(140,245,168,.5);background:rgba(20,70,40,.45)}
.slot.filled .fr::before{display:none}
.slot.hov .fr{transform:scale(1.1);border-color:#FFD23F;box-shadow:0 0 18px #FFD23F}
.slot.bad .fr{border-color:#FF5A46;box-shadow:0 0 18px #FF5A46;animation:dshake .4s}
.slot .cw{position:absolute;left:0;right:0;bottom:0}
.slot .cw svg{width:100%;height:auto;display:block;overflow:visible}
.slot .num{position:absolute;left:50%;top:22px;transform:translateX(-50%);font:22px var(--fd);font-weight:400;color:rgba(160,240,255,.55)}
.slot.filled .num{display:none}
.c-bub circle{animation:bub 1.4s ease-in-out infinite}
.c-bub circle:nth-child(2){animation-delay:.4s}.c-bub circle:nth-child(3){animation-delay:.8s}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-10px);opacity:0}}
.shelf{position:absolute;z-index:9;display:grid;gap:8px;pointer-events:auto}
.card{position:relative;border-radius:14px;background:linear-gradient(#FFF7E6,#F6DBA4);border:3px solid #8A5526;box-shadow:0 4px 0 #5A3215;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;touch-action:none;transition:transform .15s,opacity .25s,filter .25s}
.card svg{width:40px;height:40px;pointer-events:none}
.card b{font:900 10.5px/1.1 var(--fb);color:var(--brown);text-align:center;pointer-events:none;padding:0 2px}
.card .k{position:absolute;left:5px;top:3px;font:900 9px var(--fb);color:#B08A62}
.card.used{opacity:.32;filter:grayscale(.8);pointer-events:none}
.card.lift{opacity:.35}
.card.no{animation:dshake .4s;border-color:#E5322D}
.card:active{transform:scale(.96)}
.dghost{position:absolute;z-index:50;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
.dghost svg{width:100%;height:100%}
.magicfx{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;pointer-events:none;z-index:13}
.magicfx svg{width:100%;height:100%;display:block;overflow:visible}
.beam{position:absolute;width:120px;margin-left:-60px;top:0;bottom:0;background:linear-gradient(rgba(255,255,255,0),rgba(180,250,255,.55) 40%,rgba(255,255,255,0));filter:blur(4px);pointer-events:none;z-index:1}
.ptimer{position:absolute;left:50%;transform:translateX(-50%);z-index:10;font:900 11px var(--fb);color:#FFE7C2;background:rgba(28,9,5,.7);padding:3px 12px;border-radius:99px;white-space:nowrap;pointer-events:none}

/* Final */
.fhead{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left;margin-bottom:6px}
.final .gemwrap{flex:none;width:64px;height:64px;position:relative}
.final h2{font-size:23px}
.final .btn{margin-top:8px;height:44px}
.final .blist{margin:6px 0}
.final .fhead .tag{margin-bottom:3px}
.final p{font-size:13.5px;line-height:1.4}
.final .gemwrap::before{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(rgba(230,184,255,.9),rgba(230,184,255,0) 70%);animation:pulse 1.2s ease-in-out infinite alternate}
.final .gemwrap svg{position:relative;width:100%;height:100%;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.tot{display:inline-flex;align-items:baseline;gap:8px;margin:8px 0 4px;background:#3A140C;color:#FFE7C2;border-radius:14px;padding:6px 16px;font:900 11px var(--fb);letter-spacing:1px}
.tot b{font:30px var(--fd);font-weight:400;color:#FFD23F;letter-spacing:.5px}
.blist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.bi{background:rgba(255,255,255,.6);border:2px solid #E6C48A;border-radius:14px;padding:6px 4px 7px}
.bi .badgeimg{width:46px;height:50px}
.bi b{display:block;font:12.5px/1.05 var(--fd);font-weight:400;color:#B5320F;margin-top:2px}
.bi small{display:block;font:900 10.5px var(--fb);color:#6B4A30}
.bi .stars i{width:15px;height:15px}
.recap{text-align:left;background:#3A140C;color:#FFE7C2;border-radius:14px;padding:8px 12px;margin-top:4px}
.recap h4{font:15px var(--fd);font-weight:400;color:#FFD23F;margin-bottom:4px;letter-spacing:.3px}
.recap div{font:800 12px/1.3 var(--fb);display:flex;gap:7px;margin-top:4px;align-items:center}
.recap div i{flex:none;font-style:normal;width:20px;height:20px;border-radius:50%;background:#FFC93C;color:#3A140C;display:grid;place-items:center;font:900 11px var(--fb);margin-top:1px}
.recap div b{color:#fff}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg id="defs" aria-hidden="true"><defs id="defsInner"></defs></svg>
<div id="app">
  <div id="stage">
    <div id="world">
      <div class="bg" id="bgHot"></div>
      <div class="bgc" id="bgCool"></div>
      <div id="props0"></div>
      <div class="drg" id="drg" data-mood="angry" data-arms="cross"></div>
      <div class="lava" id="lava"><div class="lv"></div><div class="water"></div></div>
      <div class="floor" id="floor"></div>
      <div class="ledge L" id="ledgeL"></div>
      <div class="ledge R" id="ledgeR"></div>
      <div id="props"></div>
      <div class="chef" id="chef" data-pose="idle" data-face="smile"></div>

      <div class="tint" id="tint"></div>
      <div id="fx"></div>
    </div>
    <div id="hud" class="hide">
      <div class="hbox hs"><small>SKOR</small><b id="hScore">0</b></div>
      <div class="hbox hr"><div class="rl" id="hRageL">RAGE METER: <span id="hRageT">HIGH</span></div><div class="rb"><i id="hRage"></i></div></div>
      <div class="ht" id="hTime"><svg viewBox="0 0 46 46"><circle class="tb" cx="23" cy="23" r="19"/><circle class="tf" cx="23" cy="23" r="19"/></svg><b>30</b></div>
    </div>
    <div id="mtag" class="hide"></div>
    <div id="ui"></div>
    <button id="bgm" aria-label="Musik latar: aktif. Ketuk untuk mematikan" title="BGM on/off"></button>
    <div id="copy"><span>© Education and Training Departement 2026</span></div>
  </div>
</div>
<script>
/* =====================================================================
   ART — Kit aset SVG "Naga Ngamuk: Jangan Dibakar!"
   Semua gambar digambar ulang sebagai vektor (tanpa file gambar eksternal).
   ===================================================================== */
const ART = (() => {
  const INK = '#4A1608';
  const CLAW = '#CDEBFF', CLAWS = '#7DB0D6';
  const HORN = '#F6E4C2', HORND = '#DDBF8C';

  /* ---------- defs global (gradien dipakai bersama) ---------- */
  const defs = `
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1E0B08"/><stop offset=".42" stop-color="#4A180E"/><stop offset=".78" stop-color="#93321A"/><stop offset="1" stop-color="#C9521F"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FFC34D" stop-opacity=".95"/><stop offset=".45" stop-color="#FF8A2A" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></radialGradient>
  <linearGradient id="gSkyCool" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8FD2F5"/><stop offset=".6" stop-color="#C8ECFF"/><stop offset="1" stop-color="#EAF8FF"/></linearGradient>
  <radialGradient id="gGlowCool" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="gLava" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF08A"/><stop offset=".22" stop-color="#FFC233"/><stop offset=".6" stop-color="#FF7A18"/><stop offset="1" stop-color="#D9420E"/></linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E4FBFF"/><stop offset=".3" stop-color="#8EE0FA"/><stop offset="1" stop-color="#3FA9E0"/></linearGradient>
  <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6E5448"/><stop offset=".25" stop-color="#57413A"/><stop offset="1" stop-color="#2E211E"/></linearGradient>
  <linearGradient id="gFire" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#FFE873"/><stop offset=".5" stop-color="#FF8A1F"/><stop offset="1" stop-color="#E8361C"/></linearGradient>
  <radialGradient id="gOrb" cx=".38" cy=".34" r=".7">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#C9F1FF"/><stop offset="1" stop-color="#3AAEE8"/></radialGradient>
  <radialGradient id="gMagic" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#E9FFFF"/><stop offset=".5" stop-color="#5FF2FF" stop-opacity=".8"/><stop offset="1" stop-color="#2BC6FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE68A"/><stop offset=".5" stop-color="#FFC531"/><stop offset="1" stop-color="#E08A10"/></linearGradient>
  <linearGradient id="gHoney" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFD866"/><stop offset="1" stop-color="#E8930F"/></linearGradient>`;

  /* ===================================================================
     NAGA (rig depan, viewBox 0 0 400 430)
     - data-mood : angry | annoyed | pout | smile | giggle | happy | laugh | star | chomp
     - data-arms : cross | rest | belly | thumb | gem
     Warna kulit memakai CSS var --sk, --skD, --skL (berubah sesuai amarah)
     =================================================================== */
  function dragon() {
    const claw = (x, y, r) => `<path transform="translate(${x} ${y}) rotate(${r})" d="M0 0 l-5 13 l10 -3z" fill="${CLAW}" stroke="${CLAWS}" stroke-width="1.6" stroke-linejoin="round"/>`;
    const arm = (d, w = 34) => `<path class="skds" d="${d}" stroke-width="${w + 7}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="sks" d="${d}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    const wing = `
      <path class="skd" d="M134 246 C 108 204 76 158 20 116 C 20 148 28 166 40 180 C 24 184 14 196 10 212 C 32 211 50 222 58 238 C 44 245 38 258 38 272 C 70 262 102 266 126 284 Z"/>
      <path class="sk" d="M134 246 C 108 204 76 158 20 116 C 30 112 42 116 48 122 C 84 156 120 198 146 236 Z"/>
      <g class="sks" fill="none" stroke-width="5" stroke-linecap="round"><path d="M122 236 Q80 206 40 180"/><path d="M126 258 Q94 236 58 238"/></g>`;
    const frill = `
      <path class="skd" d="M100 110 L30 82 L50 110 L18 124 L48 136 L26 158 L98 150 Z"/>
      <g class="sks" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M98 116 L42 94"/><path d="M98 130 L32 125"/><path d="M98 144 L40 152"/></g>`;
    const horn = `
      <path fill="${HORN}" d="M148 74 C 126 56 110 34 106 2 C 132 20 156 40 174 62 Z"/>
      <path fill="${HORND}" d="M148 74 C 130 60 116 40 110 16 C 126 40 146 54 162 66 Z"/>
      <g stroke="${HORND}" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M128 40 l10 -6"/><path d="M138 54 l10 -6"/></g>`;
    const blush = `<ellipse cx="136" cy="142" rx="15" ry="8" fill="#FF5C6E" opacity=".45"/><ellipse cx="264" cy="142" rx="15" ry="8" fill="#FF5C6E" opacity=".45"/>`;
    const closedEyes = `<g stroke="${INK}" stroke-width="5.5" fill="none" stroke-linecap="round"><path d="M144 118 Q160 98 176 118"/><path d="M224 118 Q240 98 256 118"/></g>`;
    const star = (cx, cy, r) => {
      let p = '';
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
        p += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
      }
      return `<path d="${p}Z" fill="#FFD93B" stroke="#E08A00" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${cx - 4}" cy="${cy - 5}" r="3" fill="#fff"/>`;
    };
    const roundEyes = (dx = 0, dy = 0) => `
      <ellipse cx="160" cy="112" rx="15" ry="16" fill="#fff" stroke="${INK}" stroke-width="3"/>
      <ellipse cx="240" cy="112" rx="15" ry="16" fill="#fff" stroke="${INK}" stroke-width="3"/>
      <circle cx="${160 + dx}" cy="${114 + dy}" r="8.5" fill="#2B0A04"/><circle cx="${240 + dx}" cy="${114 + dy}" r="8.5" fill="#2B0A04"/>
      <circle cx="${163 + dx}" cy="${110 + dy}" r="3" fill="#fff"/><circle cx="${243 + dx}" cy="${110 + dy}" r="3" fill="#fff"/>`;
    const openMouth = `<path d="M166 182 Q200 218 234 182 Q200 190 166 182Z" fill="#8A1E1E" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M184 199 Q200 212 216 199 Q200 194 184 199Z" fill="#FF7A8A"/>`;

    return `<svg class="drgsvg" viewBox="0 0 400 430" xmlns="http://www.w3.org/2000/svg" overflow="visible">
    <g class="d-all">
      <g class="tail">
        <path class="sk" d="M246 394 C 300 408 354 394 368 344 C 378 308 364 280 340 268 C 352 296 350 322 332 340 C 312 360 280 364 248 358 Z"/>
        <path class="skd" d="M296 378 l9 -17 l8 14z M330 360 l13 -14 l4 16z M352 330 l16 -7 l-3 15z"/>
        <g class="tailfire">
          <g class="tf-in">
          <path fill="#E8361C" d="M340 274 C 312 254 314 222 336 192 C 334 212 350 220 352 238 C 360 222 358 210 354 196 C 380 220 380 256 340 274Z"/>
          <path fill="#FF8A1F" d="M341 268 C 324 254 326 232 340 214 C 342 230 352 236 352 248 C 360 240 360 230 358 222 C 370 240 366 258 341 268Z"/>
          <path fill="#FFE066" d="M342 262 C 333 254 335 242 342 233 C 344 243 350 247 350 253 C 353 249 353 245 353 240 C 360 249 355 259 342 262Z"/>
          </g>
        </g>
      </g>
      <g class="wing wingL">${wing}</g>
      <g transform="translate(400 0) scale(-1 1)"><g class="wing wingR">${wing}</g></g>
      <g class="d-body">
        <path class="sk ol" d="M114 240 C 98 300 102 362 124 396 C 160 422 240 422 276 396 C 298 362 302 300 286 240 C 258 214 228 206 200 206 C 172 206 142 214 114 240Z"/>

    chomp() { [0, .15, .3].forEach(d => { nz(.08, .14, 'lowpass', 800, 1, d); tone(150, .08, { to: 90, v: .12, t: d, type: 'triangle' }); }); },

  };

  function playCatch() {
    return new Promise(resolve => {
      const DUR = 30;
      const st = { rage: 100, t: DUR, el: 0, score: 0, combo: 0, chili: 0, good: 0, spawn: .45, chill: 0, orbs: 0, lastX: -999, tx: Chef.x, kl: 0, kr: 0, done: false };
      const items = [];
      const onPtr = e => { if (e.pointerType === 'mouse' || e.buttons || e.type === 'pointerdown') st.tx = toLocal(e.clientX, e.clientY).x; };
      const kd = e => {
        if (['ArrowLeft', 'a', 'A'].includes(e.key)) { st.kl = 1; e.preventDefault(); }
        if (['ArrowRight', 'd', 'D'].includes(e.key)) { st.kr = 1; e.preventDefault(); }
      };
      const ku = e => { if (['ArrowLeft', 'a', 'A'].includes(e.key)) st.kl = 0; if (['ArrowRight', 'd', 'D'].includes(e.key)) st.kr = 0; };
      world.addEventListener('pointerdown', onPtr); world.addEventListener('pointermove', onPtr);
      addEventListener('keydown', kd); addEventListener('keyup', ku);
      const upd = () => { setRage(st.rage); moodByRage1(st.rage); };
      HUD.score(total());

      function spawn() {
        const p = st.el / DUR; let type;
        if (st.chill > 0) type = Math.random() < .3 ? 'milk' : 'ice';
        else if (st.orbs < 2 && st.el > 7 && st.rage > 30 && Math.random() < .07) { type = 'orb'; st.orbs++; }
        else { const r = Math.random(), pc = .36 + p * .12; type = r < pc ? 'chili' : r < pc + .17 ? 'milk' : 'ice'; }
        let x = 0; for (let k = 0; k < 8; k++) { x = rand(30, LW - 30); if (Math.abs(x - st.lastX) > 80) break; }
        st.lastX = x;
        const el = h('div', 'item' + (type === 'orb' ? ' orb big' : '') + (type === 'chili' ? ' big' : ''), ART[type](), itemsL);
        const vy = (st.chill > 0 ? 200 : 205 + p * 115) + rand(-20, 25);
        items.push({ type, el, x, y: 64, vy, r: rand(-20, 20), vr: rand(-110, 110) * (type === 'chili' ? 1.5 : 1) });
      }
      function catchIt(it) {
        const b = Chef.pt(60, 128);
        it.el.animate([{ transform: `translate(${it.x}px,${it.y}px) scale(1)`, opacity: 1 }, { transform: `translate(${Chef.x}px,${b.y + 8}px) scale(.3)`, opacity: 0 }], { duration: 160, fill: 'forwards' }).onfinish = () => it.el.remove();
        if (it.type === 'chili') {
          st.rage = Math.min(100, st.rage + 12); st.combo = 0; st.chili++;
          SFX.chili(); setTimeout(() => SFX.roar(), 140);
          Chef.face('oops', 750); bubble(Chef.x + 18, Chef.top() + 10, 'OOPS!');
          upd(); Drg.flash('angry', 900); Drg.fx('hurt', 450); fireCough(); shake(9); flashTint('#FF3B1A', .28);
          pop(b.x, b.y - 30, '+12 🔥', 'bad');
          return;
        }
        if (it.type === 'orb') {
          st.chill = 4.5; SFX.orb(); flashTint('#7FDBFF', .4, 700); flashWord('CHILL RUSH!', 1100, 46);
          sparks(b.x, b.y, 10, 80, '#BFF3FF'); st.score += 100; HUD.score(total() + st.score); return;
        }
        st.combo++; st.good++;
        const mult = st.combo >= 10 ? 3 : st.combo >= 5 ? 2 : 1;
        const base = it.type === 'milk' ? 80 : 50, pts = base * mult;
        st.score += pts; st.rage = Math.max(0, st.rage - (it.type === 'milk' ? 10 : 6));
        it.type === 'milk' ? SFX.milk() : SFX.ice();
        pop(b.x, b.y - 28, '+' + pts, 'good');
        sparks(b.x, b.y, 5, 40, '#CFF6FF');
        if (st.combo === 5 || st.combo === 10 || (st.combo > 10 && st.combo % 5 === 0)) { SFX.combo(mult); pop(LW / 2, 300, `COMBO x${mult}!`, 'gold huge', { dur: 1100, dy: -40 }); }
        Chef.face('grin', 400, 'focus');
        HUD.score(total() + st.score); upd();
        if (Math.random() < .5) nostrils('steam');
      }
      function lost(it) {
        const y = LH - 40;
        if (it.type === 'chili') puff(it.x, y, 'fire', 0, -30, 34); else puff(it.x, y, 'vapor', 0, -30, 30);
        it.el.animate([{ opacity: 1 }, { opacity: 0, transform: `translate(${it.x}px,${y}px) scale(.5)` }], { duration: 200, fill: 'forwards' }).onfinish = () => it.el.remove();
      }
      const f = dt => {
        if (st.done) return;
        st.el += dt; st.t -= dt; if (st.chill > 0) st.chill -= dt;
        if (st.kl || st.kr) st.tx = Chef.x + (st.kr - st.kl) * 90;
        const hw = Chef.w / 2; st.tx = clamp(st.tx, hw, LW - hw);
        const mx = 820 * dt, dx = clamp(st.tx - Chef.x, -mx, mx);
        Chef.move(Chef.x + dx); Chef.lean(clamp(dx / Math.max(dt, .001) / 820 * 9, -9, 9));
        st.spawn -= dt;
        if (st.spawn <= 0) { spawn(); st.spawn = st.chill > 0 ? .2 : (.62 - .2 * (st.el / DUR)) * rand(.85, 1.15); }
        const cy = Chef.pt(60, 128).y, hh = Chef.w * .37;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.y += it.vy * dt; it.r += it.vr * dt;
          it.el.style.transform = `translate(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px) rotate(${it.r.toFixed(1)}deg)`;
          if (it.y >= cy - 10 && it.y <= cy + 24 && Math.abs(it.x - Chef.x) < hh) { items.splice(i, 1); catchIt(it); continue; }
          if (it.y > LH - 36) { items.splice(i, 1); lost(it); }
        }
        HUD.time(st.t, DUR);
        if (st.rage <= 0) end(true); else if (st.t <= 0) end(false);
      };
      function end(win) {
        st.done = true; Loop.del(f);
        world.removeEventListener('pointerdown', onPtr); world.removeEventListener('pointermove', onPtr);
        removeEventListener('keydown', kd); removeEventListener('keyup', ku);
        items.forEach(it => it.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).onfinish = () => it.el.remove());
        Chef.lean(0);
        resolve({ win, t: Math.max(0, st.t), score: st.score, chili: st.chili, good: st.good });
      }
      upd(); Loop.add(f);
    });
  }

  function playRhythm() {
    return new Promise(resolve => {
      const BPM = 100, SPB = 60 / BPM, LEAD = 4, APP = 1.55, PERF = .085, GOOD = .16, EARLY = .3;
      const CH = [0, 2, 4, 6, 8, 10, 12, 14, 16, 17, 18, 20, 21, 22, 24, 25, 26, 27, 28, 29, 29.5, 30, 31, 32, 32.5, 33, 34, 35, 35.5, 36, 37, 38, 40];
      const useAudio = Snd.ready;
      const now = () => useAudio ? Snd.now() : performance.now() / 1000;
      const t0 = now() + .35;
      if (useAudio) Snd.song('rhythm', t0, CH.map(b => b + LEAD));
      const notes = CH.map((b, i) => ({ t: (b + LEAD) * SPB, final: i === CH.length - 1, j: null, el: null }));
      const endT = notes[notes.length - 1].t + 1.1;
      const st = { rage: 100, score: 0, combo: 0, maxc: 0, hits: 0, miss: 0, done: false, cnt: -1 };
      setRage(100); moodByRage2(100); HUD.time(endT, endT);
      R2.hint.style.opacity = 1;
      const chinPt = () => Drg.pt(205, 232);

      function showCombo() {
        if (st.combo >= 3) { R2.combo.textContent = `COMBO x${st.combo}`; R2.combo.style.opacity = 1; R2.combo.animate([{ transform: 'translateX(-50%) scale(1.25)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 200 }); }
        else R2.combo.style.opacity = 0;
      }
      function judge(n, kind) {
        n.j = kind;
        const ringPt = { x: R2.ringX, y: R2.y };
        if (kind === 'perfect' || kind === 'good') {
          st.combo++; st.maxc = Math.max(st.maxc, st.combo); st.hits++;
          const pts = (kind === 'perfect' ? 50 : 20) * (st.combo >= 10 ? 2 : 1) + (n.final ? 300 : 0);
          st.score += pts;
          st.rage = Math.max(0, st.rage - (kind === 'perfect' ? 6 : 4.5) - (st.combo >= 8 ? 1 : 0));
          R2.ring.classList.remove('hit', 'perfect', 'miss'); void R2.ring.offsetWidth; R2.ring.classList.add(kind === 'perfect' ? 'perfect' : 'hit');
          pop(ringPt.x + 34, ringPt.y - 60, kind === 'perfect' ? 'PERFECT +' + pts : 'GOOD +' + pts, kind === 'perfect' ? 'gold' : 'green', { dur: 700, dy: -30 });
          const c = chinPt(); hearts(c.x, c.y, kind === 'perfect' ? 5 : 3, 50);
          kind === 'perfect' ? SFX.giggle() : SFX.good();
          if (st.rage > 0 || !n.final) Drg.flash('giggle', 380); Drg.fx('wiggle', 500);
          if (n.el) { n.el.animate([{ transform: n.el.style.transform + ' scale(1)', opacity: 1 }, { transform: n.el.style.transform + ' scale(2)', opacity: 0 }], { duration: 250, fill: 'forwards' }).onfinish = () => n.el && n.el.remove(); }
          if (n.final) { flashWord('FINAL TAP!', 1000, 50); sparks(c.x, c.y, 14, 110); SFX.combo(4); }
        } else {
          st.combo = 0; st.miss++; st.rage = Math.min(100, st.rage + 3);
          R2.ring.classList.remove('hit', 'perfect', 'miss'); void R2.ring.offsetWidth; R2.ring.classList.add('miss');
          pop(ringPt.x + 30, ringPt.y - 60, kind === 'early' ? 'Kecepetan!' : 'Telat!', 'bad', { dur: 700, dy: -30 });
          SFX.snort(); nostrils(st.rage > 45 ? 'smoke' : 'steam'); Drg.flash(st.rage > 50 ? 'angry' : 'annoyed', 450);
          if (n.el) n.el.classList.add('gone');
        }
        setRage(st.rage); moodByRage2(st.rage); showCombo();
        HUD.score(total() + st.score);
      }
      function tap(e) {
        if (st.done) return;
        if (e && e.target && e.target.closest && e.target.closest('button')) return;
        const t = now() - t0;
        Chef.swish();
        let best = null, bd = 99;
        for (const n of notes) { if (n.j) continue; const d = t - n.t; if (Math.abs(d) < Math.abs(bd)) { bd = d; best = n; } if (n.t - t > 1) break; }
        if (best && Math.abs(bd) <= PERF) judge(best, 'perfect');
        else if (best && Math.abs(bd) <= GOOD) judge(best, 'good');
        else if (best && bd < 0 && -bd <= EARLY) judge(best, 'early');
        else if (t > notes[0].t - .6) {
          st.combo = 0; st.rage = Math.min(100, st.rage + 1.5); SFX.stray(); Drg.flash('annoyed', 300);
          pop(R2.ringX + 30, R2.y - 60, 'Kecepetan!', 'bad', { dur: 600, dy: -24 }); setRage(st.rage); moodByRage2(st.rage); showCombo();
        }
      }
      const onDown = e => { e.preventDefault(); tap(e); };
      const kd = e => { if ((e.key === ' ' || e.key === 'Enter' || e.code === 'Space') && !e.repeat) { e.preventDefault(); tap(); } };
      world.addEventListener('pointerdown', onDown); addEventListener('keydown', kd);

      const f = () => {
        if (st.done) return;
        const t = now() - t0;
        const beat = Math.floor(t / SPB);
        if (beat >= 0 && beat < LEAD && beat !== st.cnt) { st.cnt = beat; const w = ['3', '2', '1', 'GELITIK!'][beat]; flashWord(w, beat === 3 ? 700 : 520, beat === 3 ? 52 : 96); beat === 3 ? SFX.go() : SFX.tick(); }
        const span = R2.width - (R2.ringX - R2.left) - 30, base = R2.ringX - R2.left;
        for (const n of notes) {
          if (n.j && n.j !== 'late' && n.j !== 'early') continue;
          const dtn = n.t - t;
          if (!n.el && !n.j && dtn <= APP) { n.el = h('div', 'note' + (n.final ? ' final' : ''), n.final ? ART.featherIcon() : ART.sparkleStar(), R2.lane); }
          if (n.el) {
            const x = base + dtn / APP * span;
            n.el.style.transform = `translateX(${x.toFixed(1)}px)`;
            if (x < -40) { n.el.remove(); n.el = null; if (n.j) n.j = n.j + '-x'; }
          }
          if (!n.j && dtn < -GOOD) judge(n, 'late');
          if (dtn > APP + .2) break;
        }
        if (t > notes[4].t && R2.hint.style.opacity !== '0') R2.hint.style.opacity = 0;
        HUD.time(endT - Math.max(0, t), endT);
        if (t > endT) end();
      };
      function end() {
        st.done = true; Loop.del(f);
        world.removeEventListener('pointerdown', onDown); removeEventListener('keydown', kd);
        notes.forEach(n => n.el && n.el.remove());
        R2.combo.style.opacity = 0;
        resolve({ win: st.rage <= 40, rage: st.rage, score: st.score, hits: st.hits, n: notes.length, maxc: st.maxc });
      }
      Loop.add(f);
    });
  }

  /* =====================================================================
     MISI 3 — THE MAGIC MARSHMALLOW PUZZLE
     ===================================================================== */
  const ING_NAME = { madu: 'Madu Manis', mint: 'Daun Mint', marsh: 'Marshmallow', keju: 'Keju Hangat', cabai: 'Cabai Api', garam: 'Garam Asin', kopi: 'Kopi Pahit', lemon: 'Lemon Asam' };
  const ROUNDS = [
    { name: 'Marshmallow Madu-Mint', rec: ['madu', 'mint', 'marsh'], dec: ['cabai', 'garam', 'kopi'], time: 15 },
    { name: 'Marshmallow Keju Hangat', rec: ['madu', 'mint', 'keju'], dec: ['cabai', 'lemon', 'marsh'], time: 7 },
    { name: 'Masterstroke Kilat!', rec: ['marsh', 'keju', 'madu'], dec: ['cabai', 'kopi', 'mint'], time: 3, kilat: true }
  ];
  const MOOD3 = [60, 38, 18, 0];
  function buildMG3() {
    M3.order = h('div', 'order', `<div class="oh">PESANAN NAGA</div><div class="on"></div><div class="oi"></div>`, props);
    M3.slots = [0, 1, 2].map(i => h('div', 'slot', `<div class="fr"><span class="num">${i + 1}</span></div><div class="cw">${ART.cauldron()}</div>`, props));
    M3.shelf = h('div', 'shelf', '', props);
    M3.ptimer = h('div', 'ptimer', '', props); M3.ptimer.style.opacity = 0;
    LAYOUTS.mg3();
  }
  function setOrder(R) {
    M3.order.querySelector('.on').textContent = R.name;
    M3.order.querySelector('.oi').innerHTML = R.rec.map(k => `<span data-k="${k}" title="${ING_NAME[k]}">${ART.ingredient(k)}</span>`).join('');
    M3.order.classList.toggle('kilat', !!R.kilat);
    M3.order.animate([{ transform: 'scale(.5)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: .7 }, { transform: 'none' }], { duration: 450, easing: 'ease-out' });
  }
  async function mission3() {
    setScene('mg3'); buildMG3();
    Drg.force('pout'); Drg.set(null, 'cross'); Drg.rage(45); HUD.rage(MOOD3[0], 'MOOD', 'MANYUN');
    HUD.show(true); HUD.mission('MISI 3 · MAGIC MARSHMALLOW PUZZLE'); HUD.time(15, 15); HUD.score(total());
    Chef.set('idle', 'smile');
    music('magic');
    const stopAmb = ambient();
    setOrder(ROUNDS[0]);
    await brief(2);
    const st = { score: 0, errors: 0, retries: 0 };
    for (let r = 0; r < 3; r++) {
      let extra = 0;
      for (; ;) {
        const res = await playRound(r, extra, st);
        if (res) break;
        st.retries++; extra = Math.min(extra + 1.5, 4.5);
        const md = modal(`<div class="face">${miniDragon('pout')}</div><h2>Waktu habis!</h2><p style="margin-top:6px">Naganya makin manyun 😤 Ayo ulangi pesanan <b>${ROUNDS[r].name}</b>. Waktumu ditambah <b>+${extra.toLocaleString('id-ID')} detik</b>.</p><button class="btn">↺ Ulangi Pesanan</button>`);
        await clickOnce(md.p.querySelector('.btn')); await md.close();
      }
    }
    G.score[2] = st.score;
    const bad = st.errors + st.retries * 2;
    G.stars[2] = bad === 0 ? 3 : bad <= 3 ? 2 : 1;
    HUD.score(total());
    /* hadiah permata */
    music('win'); SFX.win();
    HUD.rage(0, 'MOOD', 'ULTIMATE CALM'); Drg.rage(0);
    Drg.force('star'); Drg.set(null, 'rest'); Drg.fx('hop', 600);
    const c = Drg.pt(200, 120); hearts(c.x, c.y, 14, 120); confetti(70);
    pop(c.x, c.y - 70, '✨ Enaaak! ✨', 'gold', { dur: 1600, dy: -26 });
    await sleep(1500);
    Drg.set(null, 'gem'); SFX.gem();
    const gp = Drg.pt(200, 296);
    pop(gp.x, gp.y - 40, 'Ini untukmu, Chef!', 'pink', { dur: 1700, dy: -20 });
    sparks(gp.x, gp.y, 12, 70, '#E6B8FF');
    await sleep(1500);
    const gem = h('div', 'magicfx', ART.gem(), fx);
    Drg.set(null, 'thumb'); Drg.force('happy');
    const tx = LW / 2, ty = 250;
    gem.animate([{ transform: `translate(${gp.x}px,${gp.y}px) scale(.7)` }, { transform: `translate(${(gp.x + tx) / 2}px,${Math.min(gp.y, ty) - 90}px) scale(1.6) rotate(-20deg)`, offset: .5 },
      { transform: `translate(${tx}px,${ty}px) scale(2.4) rotate(0)` }], { duration: 1100, easing: 'ease-in-out', fill: 'forwards' });
    SFX.magic();
    await sleep(1150);
    sparks(tx, ty, 18, 130, '#E6B8FF'); SFX.gem(); Chef.set('thumbs', 'grin');
    await sleep(700);
    gem.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).onfinish = () => gem.remove();
    await winScreen({ t1: 'PERFECT MASTERSTROKE!', t2: 'TOTAL PEACE ACHIEVED!', sub: 'Naga melahap camilannya, matanya berbinar, lalu memberimu <b>Permata Kedamaian</b> 💎 — tanda "urusan selesai, kamu aman."',
      score: G.score[2], bonus: st.errors ? `${st.errors} salah pilih bahan` : 'tanpa salah pilih bahan!', stars: G.stars[2], badge: icon64(ART.dragonFace()) });
    await lesson(2);
    stopAmb();
  }

  function playRound(ri, extra, st) {
    return new Promise(async resolve => {
      const R = ROUNDS[ri], T = R.time + extra;
      let active = false, tLeft = T, placed = [], combo = 0, errs = 0, finished = false;
      setOrder(R);
      M3.slots.forEach(s => { s.classList.remove('filled', 'bad', 'hov'); s.querySelector('.fr').innerHTML = `<span class="num">${M3.slots.indexOf(s) + 1}</span>`; });
      const items = shuffle(R.rec.concat(R.dec));
      M3.shelf.innerHTML = '';
      const cards = items.map((k, i) => {
        const c = h('div', 'card', `<span class="k">${i + 1}</span>${ART.ingredient(k)}<b>${ING_NAME[k]}</b>`, M3.shelf);
        c.dataset.k = k;
        c.animate([{ opacity: 0, transform: 'translateY(20px) scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: i * 60, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' });
        return c;
      });
      HUD.time(T, T, !!R.kilat);
      Drg.force(ri === 0 ? 'pout' : 'smile'); Drg.set(null, ri === 0 ? 'cross' : 'rest');
      M3.ptimer.textContent = `PESANAN ${ri + 1}/3`; M3.ptimer.style.opacity = 1;

      /* --- interaksi --- */
      const firstEmpty = () => M3.slots.findIndex(s => !s.classList.contains('filled'));
      function tryPlace(card, si) {
        if (!active || card.classList.contains('used')) return;
        const k = card.dataset.k;
        if (si < 0 || M3.slots[si].classList.contains('filled')) si = firstEmpty();
        if (si < 0) return;
        const slot = M3.slots[si], sr = rectLocal(slot.querySelector('.fr'));
        if (R.rec.includes(k) && !placed.includes(k)) {
          placed.push(k); combo++;
          slot.classList.add('filled'); slot.querySelector('.fr').innerHTML = ART.ingredient(k);
          slot.querySelector('.fr').animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'cubic-bezier(.34,1.56,.64,1)' });
          card.classList.add('used');
          const oi = M3.order.querySelector(`.oi span[data-k="${k}"]`); if (oi) oi.classList.add('ok');
          const pts = 100 * Math.min(combo, 3); st.score += pts;
          SFX.place(); sparks(sr.x + sr.w / 2, sr.y + sr.h / 2, 8, 50, '#BFF8FF');
          pop(sr.x + sr.w / 2, sr.y - 6, combo >= 2 ? `COMBO x${combo}! +${pts}` : '+' + pts, combo >= 2 ? 'gold' : 'good', { dur: 800, dy: -30 });
          HUD.score(total() + st.score);
          if (placed.length === 3) finish(true);
        } else {
          errs++; st.errors++; combo = 0;
          SFX.wrong(); card.classList.remove('no'); void card.offsetWidth; card.classList.add('no'); setTimeout(() => card.classList.remove('no'), 450);
          slot.classList.remove('bad'); void slot.offsetWidth; slot.classList.add('bad'); setTimeout(() => slot.classList.remove('bad'), 450);
          pop(sr.x + sr.w / 2, sr.y - 6, placed.includes(k) ? 'Sudah ada!' : 'Bukan itu!', 'bad', { dur: 800, dy: -26 });
          Drg.flash('annoyed', 600); nostrils('steam'); SFX.snort();
        }
      }
      let drag = null;
      const hitSlot = (cx, cy) => {
        const p = toLocal(cx, cy);
        return M3.slots.findIndex(s => { const r = rectLocal(s); return p.x >= r.x - 14 && p.x <= r.x + r.w + 14 && p.y >= r.y - 14 && p.y <= r.y + r.h + 10; });
      };
      const onDown = e => {
        const card = e.target.closest && e.target.closest('.card'); if (!card || !active || card.classList.contains('used')) return;
        e.preventDefault();
        try { card.setPointerCapture(e.pointerId); } catch (_) { }
        drag = { card, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, ghost: null, hov: -1 };
      };
      const onMove = e => {
        if (!drag || e.pointerId !== drag.id) return;
        if (!drag.moved) {
          if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 7 * SC) return;
          drag.moved = true; drag.ghost = h('div', 'dghost', ART.ingredient(drag.card.dataset.k), fx); drag.card.classList.add('lift'); SFX.pop();
        }
        const p = toLocal(e.clientX, e.clientY); drag.ghost.style.transform = `translate(${p.x}px,${p.y}px) rotate(-6deg)`;
        const hs = hitSlot(e.clientX, e.clientY);
        if (hs !== drag.hov) { if (drag.hov >= 0) M3.slots[drag.hov].classList.remove('hov'); if (hs >= 0) M3.slots[hs].classList.add('hov'); drag.hov = hs; }
      };
      const onUp = e => {
        if (!drag || e.pointerId !== drag.id) return;
        const d = drag; drag = null;
        if (d.hov >= 0) M3.slots[d.hov].classList.remove('hov');
        d.card.classList.remove('lift');
        if (d.ghost) d.ghost.remove();
        if (!d.moved) { tryPlace(d.card, -1); return; }
        const hs = hitSlot(e.clientX, e.clientY);
        if (hs >= 0) tryPlace(d.card, hs);
      };
      const onCancel = e => { if (!drag || e.pointerId !== drag.id) return; if (drag.ghost) drag.ghost.remove(); drag.card.classList.remove('lift'); if (drag.hov >= 0) M3.slots[drag.hov].classList.remove('hov'); drag = null; };
      const kd = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 6 && cards[n - 1]) { e.preventDefault(); tryPlace(cards[n - 1], -1); } };
      M3.shelf.addEventListener('pointerdown', onDown);
      addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('pointercancel', onCancel); addEventListener('keydown', kd);
      const cleanup = () => {
        M3.shelf.removeEventListener('pointerdown', onDown);
        removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onCancel); removeEventListener('keydown', kd);
        if (drag && drag.ghost) drag.ghost.remove(); drag = null;
      };

      /* --- pembukaan ronde --- */
      await sleep(450);
      if (R.kilat) {
        flashWord('PESANAN KILAT!', 1100, 44); SFX.roar(); await sleep(1150);
        await countdown(['3', '2', '1', 'GAS!']);
      } else if (ri === 0) {
        const o = rectLocal(M3.order); pop(Math.min(o.x + o.w / 2, LW - 110), o.y + o.h + 18, '☝ Cek pesanannya!', 'gold', { dur: 1500, dy: -6 });
        await sleep(900); await countdown(['SIAP?', 'MULAI!']);
      } else { await countdown(['PESANAN BARU!', 'MULAI!']); }
      active = true;
      const f = dt => {
        if (!active) return;
        tLeft -= dt; HUD.time(tLeft, T, !!R.kilat);
        if (tLeft <= 0) finish(false);
      };
      Loop.add(f);

      async function finish(ok) {
        if (finished) return; finished = true; active = false; Loop.del(f); cleanup();
        if (!ok) {
          SFX.snort(); Drg.force('pout'); Drg.set(null, 'cross'); Drg.fx('hurt'); nostrils('smoke', 2);
          flashWord('WAKTU HABIS!', 1000, 46);
          M3.order.querySelectorAll('.oi span').forEach(s => s.classList.remove('ok'));
          await sleep(1100); resolve(false); return;
        }
        const bonus = Math.round(Math.max(0, tLeft) * (R.kilat ? 300 : 100)) + (errs === 0 ? 200 : 0);
        st.score += bonus; HUD.score(total() + st.score);
        /* ramuan: bahan terbang ke tungku tengah */
        SFX.magic();
        const mid = rectLocal(M3.slots[1].querySelector('.cw')), mx = mid.x + mid.w / 2, my = mid.y + mid.h * .3;
        M3.slots.forEach(s => {
          const fr = s.querySelector('.fr'), r = rectLocal(fr), g = h('div', 'magicfx', fr.innerHTML, fx);
          g.animate([{ transform: `translate(${r.x + r.w / 2}px,${r.y + r.h / 2}px) scale(.8)`, opacity: 1 }, { transform: `translate(${mx}px,${my}px) scale(.3) rotate(180deg)`, opacity: 0 }],
            { duration: 600, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
          s.classList.remove('filled'); fr.innerHTML = '';
        });
        await sleep(620);
        sparks(mx, my, 16, 80, '#BFF8FF'); flashTint('#9DF2FF', .3, 500);
        pop(mx, my - 50, R.kilat ? `KILAT! +${bonus}` : `Bonus +${bonus}`, 'gold', { dur: 1100, dy: -30 });
        const mm = h('div', 'magicfx', ART.magicMarsh(), fx);
        const mouth = Drg.pt(200, 192);
        Drg.force('chomp'); Drg.set(null, 'rest');
        await mm.animate([{ transform: `translate(${mx}px,${my}px) scale(.2)` }, { transform: `translate(${mx}px,${my - 70}px) scale(1.2)`, offset: .35 },
          { transform: `translate(${(mx + mouth.x) / 2}px,${Math.min(my, mouth.y) - 110}px) scale(1)`, offset: .65 }, { transform: `translate(${mouth.x}px,${mouth.y}px) scale(.35)` }],
          { duration: 1250, easing: 'ease-in-out', fill: 'forwards' }).finished;
        mm.remove();
        SFX.chomp(); Drg.fx('wiggle', 600);
        await sleep(520);
        const lv = MOOD3[ri + 1];
        Drg.rage(lv * .7); HUD.rage(lv, 'MOOD', ['MULAI SENYUM', 'SENANG', 'ULTIMATE CALM'][ri]);
        Drg.force(ri === 2 ? 'star' : 'happy');
        const c = Drg.pt(200, 130); hearts(c.x, c.y, 6 + ri * 3, 80);
        SFX.good();
        pop(c.x, c.y - 70, ['Nyam! Lumayan~', 'Nyam nyam! Enak!', 'NYAAAM!! 😍'][ri], 'pink', { dur: 1200, dy: -24 });
        cards.forEach(cd => cd.classList.add('used'));
        await sleep(ri === 2 ? 600 : 1300);
        resolve(true);
      }
    });
  }

  /* =====================================================================
     HASIL AKHIR
     ===================================================================== */
  async function finale() {
    setScene('final'); HUD.show(false); HUD.mission(null);
    Drg.force('happy'); Drg.set(null, 'thumb'); Drg.rage(0);
    Chef.set('thumbs', 'grin'); chefEl.classList.add('bounce');
    music('win');
    const stopAmb = ambient();
    let hT = setInterval(() => { const c = Drg.pt(200, 110); hearts(c.x + rand(-60, 60), c.y, 2, 60); }, 900);
    confetti(80);
    sendLMS();
    const tot = total();
    const md = modal(`<div class="final"><div class="fhead"><div class="gemwrap">${ART.gem()}</div><div><span class="tag green">MISI TUNTAS!</span>
      <h2>Kamu Aman, Chef ${NM()}!</h2></div></div>
      <p>Naga sudah tenang, perutnya kenyang, dan dapur istana selamat. Urusan selesai! 🐉💜</p>
      <div class="tot">TOTAL SKOR <b>${fmt(tot)}</b></div>
      <div class="blist">${[0, 1, 2].map(i => `<div class="bi"><div class="badgeimg">${ART.badge(LESSONS[i].icon())}</div><b>${LESSONS[i].title}</b>${starsHTML(G.stars[i], .3 + i * .3)}<small>${fmt(G.score[i])} poin</small></div>`).join('')}</div>
      <div class="recap"><h4>3 Jurus Meredam "Naga" di Tempat Kerja</h4>
        <div><i>1</i><span><b>Dinginkan dulu</b> — redam sumber panas.</span></div>
        <div><i>2</i><span><b>Pas ritme & timing</b> — jangan buru-buru.</span></div>
        <div><i>3</i><span><b>Tutup dengan tepat</b> — solusi manis & pas.</span></div></div>
      <button class="btn ghost" id="again">↺ Main Lagi</button></div>`, { light: true, cls: 'top' });
    md.p.querySelectorAll('.bi').forEach((e, k) => e.animate([{ opacity: 0, transform: 'translateY(20px) scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 300 + k * 150, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }));
    await clickOnce(md.p.querySelector('#again'));
    clearInterval(hT); stopAmb(); await md.close();
    chefEl.classList.remove('bounce');
    G.score = [0, 0, 0]; G.stars = [0, 0, 0];
    await run();
  }

  /* ================= ALUR UTAMA ================= */
  async function run() {
    const steps = [mission1, mission2, mission3];
    for (const s of steps) {
      try { await s(); }
      catch (e) { console.error('[naga] error di', s.name, e); try { ui.innerHTML = ''; } catch (_) { } }
    }
    await finale();
  }
  async function main() {
    fit(true);
    await startScreen();
    await intro();
    await run();
  }
  main().catch(e => console.error(e));
})();

</script>
